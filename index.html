<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecting to Prof. Dr. Mohamed Aboelghar Portfolio...</title>
  
  <!-- Immediate HTTP Meta Refresh Fallback -->
  <meta http-equiv="refresh" content="0;url=https://mohamedaboelghar.com/">
  <link rel="canonical" href="https://mohamedaboelghar.com/">
  <meta name="robots" content="noindex, follow">

  <!-- Dynamic Smart Subpath Redirect Script -->
  <script>
    (function() {
      var targetDomain = "https://mohamedaboelghar.com";
      var path = window.location.pathname.replace(/\/index\.html$/i, '');
      if (!path.startsWith('/')) {
        path = '/' + path;
      }
      var targetUrl = targetDomain + path + window.location.search + window.location.hash;
      window.location.replace(targetUrl);
    })();
  </script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      background-color: #0b0f19;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      text-align: center;
    }
    .redirect-card {
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 1.25rem;
      padding: 2.5rem 2rem;
      max-width: 520px;
      width: 100%;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(12px);
    }
    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid rgba(2, 132, 199, 0.2);
      border-top-color: #0284c7;
      border-radius: 50%;
      margin: 0 auto 1.5rem;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    h1 {
      font-size: 1.25rem;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 0.5rem;
    }
    p {
      font-size: 0.9rem;
      color: #94a3b8;
      margin-bottom: 1.5rem;
      line-height: 1.5;
    }
    .target-url-box {
      background: rgba(2, 132, 199, 0.1);
      border: 1px solid rgba(2, 132, 199, 0.3);
      color: #38bdf8;
      padding: 0.5rem 1rem;
      border-radius: 0.5rem;
      font-family: monospace;
      font-size: 0.85rem;
      word-break: break-all;
      margin-bottom: 1.5rem;
    }
    .btn-redirect {
      display: inline-block;
      background: linear-gradient(135deg, #0284c7, #2563eb);
      color: #ffffff;
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 600;
      padding: 0.75rem 1.5rem;
      border-radius: 50rem;
      box-shadow: 0 4px 15px rgba(2, 132, 199, 0.4);
      transition: all 0.3s ease;
    }
    .btn-redirect:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(2, 132, 199, 0.6);
    }
  </style>
</head>
<body>
  <div class="redirect-card">
    <div class="spinner"></div>
    <h1>Redirecting to Official Portfolio</h1>
    <p>Transferring you directly to the requested page on Prof. Dr. Mohamed Aboelghar's official domain:</p>
    <div class="target-url-box" id="target-url-display">https://mohamedaboelghar.com/</div>
    <a href="https://mohamedaboelghar.com/" id="manual-link" class="btn-redirect">Click here if not redirected automatically</a>
  </div>

  <script>
    (function() {
      var targetDomain = "https://mohamedaboelghar.com";
      var path = window.location.pathname.replace(/\/index\.html$/i, '');
      if (!path.startsWith('/')) {
        path = '/' + path;
      }
      var finalUrl = targetDomain + path + window.location.search + window.location.hash;
      document.getElementById('manual-link').href = finalUrl;
      document.getElementById('target-url-display').textContent = finalUrl;
    })();
  </script>
</body>
</html>
